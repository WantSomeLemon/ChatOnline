<div style="max-width: 500px; margin: 20px auto; font-family: sans-serif;">
  <div style="background: #28a745; color: white; padding: 15px; border-radius: 4px 4px 0 0;">
    <h3 style="margin: 0;">Phòng Chat Nhóm: {{ roomId }}</h3>
    <small>Bạn đang online với biệt danh: <b>{{ userId }}</b></small>
  </div>

  <div style="border: 1px solid #ccc; border-top: none; height: 350px; overflow-y: auto; padding: 15px; background: #fdfdfd; margin-bottom: 10px;">
    <div *ngFor="let msg of messages" style="margin-bottom: 12px; word-wrap: break-word;">
      <span [style.color]="msg.senderId === userId ? '#007bff' : '#28a745'">
        <strong>{{ msg.senderId }}</strong>:
      </span>
      <span style="color: #333;">{{ msg.content }}</span>

      <div style="font-size: 9px; color: #aaa; margin-top: 2px;" *ngIf="msg.timestamp">
        {{ msg.timestamp | date:'HH:mm:ss' }}
      </div>
    </div>

    <div *ngIf="messages.length === 0" style="text-align: center; color: #999; margin-top: 100px; font-size: 14px;">
      Chưa có tin nhắn nào. Hãy gõ chữ để bắt đầu cuộc trò chuyện!
    </div>
  </div>

  <div style="display: flex;">
    <input [(ngModel)]="messageContent"
           (keyup.enter)="sendMessage()"
           placeholder="Nhập nội dung tin nhắn..."
           style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none;"/>
    <button (click)="sendMessage()"
            style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 5px; font-weight: bold;">
      Gửi
    </button>
  </div>
</div>
