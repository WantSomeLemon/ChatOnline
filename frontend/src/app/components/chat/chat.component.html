<div class="chat-container" style="max-width: 600px; margin: 20px auto; font-family: sans-serif;">
  <h3>Room Chat: {{ roomId }}</h3>

  <div class="chat-box" style="border: 1px solid #ddd; border-radius: 8px; height: 350px; overflow-y: auto; padding: 15px; margin-bottom: 10px; background-color: #f9f9f9;">
    @for (msg of messagesList; track msg.timestamp) {
    <div style="margin-bottom: 10px;">
      <span style="font-weight: bold; color: #007bff;">[{{ msg.displayUsername }}]:</span>
      <span style="margin-left: 5px; background: #fff; padding: 5px 10px; border-radius: 4px; border: 1px solid #eee; display: inline-block;">
          {{ msg.content }}
        </span>
    </div>
    } @empty {
    <p style="color: #999; text-align: center; margin-top: 150px;">Chưa có tin nhắn nào. Hãy gửi tin nhắn đầu tiên!</p>
    }
  </div>

  <div style="display: flex; gap: 10px;">
    <input
      [(ngModel)]="messageContent"
      (keyup.enter)="onSendMessage()"
      placeholder="Nhập nội dung tin nhắn..."
      style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none;"
    >
    <button
      (click)="onSendMessage()"
      style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;"
    >
      Gửi
    </button>
  </div>
</div>
